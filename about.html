<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="about.docTitle">د. علاء حجاج — عن الطبيب</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/refinements.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/experience.css">
  <script src="js/i18n-data.js"></script>
  <script src="js/i18n.js"></script>
</head>

<body data-page="about">
  <div id="site-header"></div>

  <main id="main">
    <section class="about-intro section">
      <div class="container about-intro-grid">
        <div class="about-profile">
          <span class="eyebrow" data-anim data-i18n="about.eyebrow"></span>
          <h1 class="heading" data-anim data-i18n="about.h1"></h1>
          <p data-anim data-i18n="about.lead"></p>
          <!-- The photograph and the badge that hovers over its corner. -->
          <div class="about-clinic-frame" data-anim>
            <img class="about-clinic" src="assets/clinic-wide.jpg" alt=""
              data-i18n-attr="alt:about.clinicAlt" loading="lazy">
            <div class="about-badge">
              <b data-i18n="about.badgeYears"></b>
              <span data-i18n="about.badgeLabel"></span>
            </div>
          </div>
        </div>

        <div class="about-expertise">
          <h2 class="heading" data-anim data-i18n="about.expertiseTitle"></h2>
          <blockquote data-anim data-i18n="about.quote"></blockquote>
          <h3 data-anim data-i18n="about.journeyLabel"></h3>

          <div class="about-timeline">
            <article data-anim>
              <span class="timeline-dot"></span>
              <b data-i18n="about.t1.year"></b>
              <strong class="heading" data-i18n="about.t1.title"></strong>
              <small data-i18n="about.t1.place"></small>
            </article>
            <article data-anim>
              <span class="timeline-dot"></span>
              <b data-i18n="about.t2.year"></b>
              <strong class="heading" data-i18n="about.t2.title"></strong>
              <small data-i18n="about.t2.place"></small>
            </article>
            <article data-anim>
              <span class="timeline-dot"></span>
              <b data-i18n="about.t3.year"></b>
              <strong class="heading" data-i18n="about.t3.title"></strong>
              <small data-i18n="about.t3.place"></small>
            </article>
            <article data-anim>
              <span class="timeline-dot"></span>
              <b data-i18n="about.t4.year"></b>
              <strong class="heading" data-i18n="about.t4.title"></strong>
              <small data-i18n="about.t4.place"></small>
            </article>
          </div>
        </div>
      </div>
    </section>

    <section class="about-journey section">
      <div class="container">
        <h2 class="heading about-section-title" data-anim data-i18n="about.excellenceTitle"></h2>

        <div class="journey-feature">
          <blockquote class="doctor-quote" data-anim>
            <span aria-hidden="true">”</span>
            <strong data-i18n="about.doctorQuote"></strong>
            <small data-i18n="about.doctorName"></small>
          </blockquote>

          <article class="education-card" data-anim>
            <img src="assets/lab.jpg" alt="" data-i18n-attr="alt:about.eduAlt" loading="lazy">
            <div>
              <span data-i18n="about.eduLabel"></span>
              <h3 class="heading" data-i18n="about.eduTitle"></h3>
              <p data-i18n="about.eduBody"></p>
              <ul>
                <li data-i18n="about.eduItem1"></li>
                <li data-i18n="about.eduItem2"></li>
              </ul>
            </div>
          </article>
        </div>

        <div class="about-cards">
          <article class="contribution-card" data-anim>
            <h3 class="heading" data-i18n="about.contribTitle"></h3>
            <p data-i18n="about.contribBody"></p>
          </article>
          <article class="award-card" data-anim>
            <img class="award-icon" src="assets/icon-about.svg" alt="" aria-hidden="true">
            <h3 class="heading" data-i18n="about.awardTitle"></h3>
            <p data-i18n="about.awardBody"></p>
          </article>
        </div>

        <div class="cta-band about-cta" data-anim>
          <div>
            <h2 class="heading" data-i18n="details.ctaTitle"></h2>
            <p data-i18n="details.ctaBody"></p>
          </div>
          <a class="btn btn-glow" href="booking.html" data-i18n="details.ctaBtn"></a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/icons.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/slider.js"></script>
  <script src="js/portfolio-filter.js"></script>
  <script src="js/fields.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/scroll.js"></script>
</body>

</html>
